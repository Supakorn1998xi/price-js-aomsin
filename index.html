<!doctype html>
<html lang="th">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width,initial-scale=1" />
  <title>Dinosaur Fai Header</title>

  <!-- Font -->
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link
    href="https://fonts.googleapis.com/css2?family=Kanit:wght@400;600;700;800;900&display=swap"
    rel="stylesheet"
  />

  <!-- CSS -->
  <link rel="stylesheet" href="./styles.css" />
</head>

<body>
  <!-- ===== Header Only ===== -->
  <header class="hdr">
    <div class="hdr-left">
      <div class="brand">
        <img src="./image/source.gif" alt="Dinosaur" class="brand-icon dino-gif" />
        <div class="brand-text">
          <span class="brand-name">Dinosaur Fai</span>
          <span class="brand-dot">.com</span>
        </div>
      </div>
    </div>

    <div class="hdr-center">
      <div class="dt">
        <div class="dt-label">Date</div>
        <div id="hdrDate" class="dt-value">-</div>
      </div>

      <div class="dt">
        <div class="dt-label">Time</div>
        <div id="hdrTime" class="dt-value">-</div>
      </div>
    </div>

    <div class="hdr-right">
      <div class="lu">
        <div class="lu-label">Last Update</div>
        <div id="hdrLastUpdate" class="lu-value">-</div>
      </div>
    </div>
  </header>

  <div class="page-white">

    <!-- ===== Filter Bar ===== -->
    <section class="filterbar">
      <div class="filterbar-inner">

        <!-- Date Range (Start/Until + Days) -->
        <div class="fblk fblk-date">
          <div class="date-pair">
            <div class="datecol">
              <div class="flabel">Start</div>
              <div class="datebox">
                <!-- ✅ ต้องเป็น dateFrom -->
                <input id="dateFrom" type="date" />
              </div>
            </div>

            <div class="datecol">
              <div class="flabel">Until</div>
              <div class="datebox">
                <input id="dateTo" type="date" />
              </div>
            </div>

            <div class="days" id="dayDiff">-</div>
          </div>
        </div>

        <!-- Type -->
        <div class="fblk">
        <div class="flabel">Type</div>
        <div class="ms">
            <button type="button" class="ms-btn" id="msBtn-type">
            All <span class="ms-caret">▾</span>
            </button>

            <div class="ms-panel" id="msPanel-type" hidden>
            <div class="ms-actions">
                <button type="button" class="ms-act" data-act="all" data-key="type">Select all</button>
                <button type="button" class="ms-act" data-act="none" data-key="type">Clear</button>
            </div>
            <div class="ms-list" id="msList-type"></div>
            </div>
        </div>
        </div>

        <!-- Type End -->
        <div class="fblk">
        <div class="flabel">Type End</div>
        <div class="ms">
            <button type="button" class="ms-btn" id="msBtn-typeEnd">
            All <span class="ms-caret">▾</span>
            </button>

            <div class="ms-panel" id="msPanel-typeEnd" hidden>
            <div class="ms-actions">
                <button type="button" class="ms-act" data-act="all" data-key="typeEnd">Select all</button>
                <button type="button" class="ms-act" data-act="none" data-key="typeEnd">Clear</button>
            </div>
            <div class="ms-list" id="msList-typeEnd"></div>
            </div>
        </div>
        </div>

        <!-- List -->
        <div class="fblk">
        <div class="flabel">List</div>
        <div class="ms">
            <button type="button" class="ms-btn" id="msBtn-list">
            All <span class="ms-caret">▾</span>
            </button>

            <div class="ms-panel" id="msPanel-list" hidden>
            <div class="ms-actions">
                <button type="button" class="ms-act" data-act="all" data-key="list">Select all</button>
                <button type="button" class="ms-act" data-act="none" data-key="list">Clear</button>
            </div>
            <div class="ms-list" id="msList-list"></div>
            </div>
        </div>
        </div>

        <!-- Channel -->
        <div class="fblk">
        <div class="flabel">Channel</div>
        <div class="ms">
            <button type="button" class="ms-btn" id="msBtn-channel">
            All <span class="ms-caret">▾</span>
            </button>

            <div class="ms-panel" id="msPanel-channel" hidden>
            <div class="ms-actions">
                <button type="button" class="ms-act" data-act="all" data-key="channel">Select all</button>
                <button type="button" class="ms-act" data-act="none" data-key="channel">Clear</button>
            </div>
            <div class="ms-list" id="msList-channel"></div>
            </div>
        </div>
        </div>

        

        <!-- Actions -->
        <div class="fblk fblk-actions">
          <div class="flabel">&nbsp;</div>
          <div class="actions">
            <button id="btnClear" class="btn-pill btn-pill-dark">Clear Filter</button>
            <button id="btnRefresh" class="btn-pill btn-pill-light">Refresh</button>
          </div>
        </div>

      </div>
    </section>

    <!-- Chart -->
     <section class="chart card">
        <div class="chart-head">
            <div class="chart-title">Price bt Date</div>
            <div id="chartInfo" class="chart-sub">-</div>
        </div>
        <div class="chart-wrap">
            <canvas id="priceChart" height="250"></canvas>
        </div>
     </section>

    <!-- ===== Debug Table ===== -->
    <section class="dbg card">
      <div class="dbg-head">
        <div>
          <div class="dbg-title">Debug Table</div>
          <div id="dbgInfo" class="dbg-sub">-</div>
        </div>
        <button id="btnDebugReload" class="btn-pill btn-pill-light">Reload</button>
      </div>

      <div class="dbg-tablewrap">
        <table id="dbgTable">
          <thead id="dbgThead"></thead>
          <tbody id="dbgTbody"></tbody>
        </table>
      </div>
    </section>

  </div>

  <!-- Header clock script (เดิมของคุณ) -->
  <script>
    const pad2 = (n) => String(n).padStart(2, "0");

    function formatDateHeader(d) {
      const base = new Intl.DateTimeFormat("en-GB", {
        day: "2-digit",
        month: "short",
        year: "numeric",
      }).format(d);

      const weekday = new Intl.DateTimeFormat("en-GB", {
        weekday: "short",
      }).format(d);

      return `${base} (${weekday})`;
    }

    function formatTime(d) {
      return `${pad2(d.getHours())}:${pad2(d.getMinutes())}:${pad2(d.getSeconds())}`;
    }

    function renderDate() {
      const el = document.getElementById("hdrDate");
      if (!el) return;
      el.textContent = formatDateHeader(new Date());
    }

    function renderTime() {
      const el = document.getElementById("hdrTime");
      if (!el) return;
      el.textContent = formatTime(new Date());
    }

    function setLastUpdate(date = new Date()) {
      const el = document.getElementById("hdrLastUpdate");
      if (!el) return;

      const dt = new Intl.DateTimeFormat("en-GB", {
        day: "2-digit",
        month: "short",
        year: "numeric",
      }).format(date);

      el.textContent = `${dt} ${formatTime(date)}`;
    }

    renderDate();
    renderTime();
    setLastUpdate(new Date());
    setInterval(renderDate, 60 * 1000);
    setInterval(renderTime, 1000);
    window.setLastUpdate = setLastUpdate;
  </script>

  <!-- ✅ app.js -->
    <script src="https://cdn.jsdelivr.net/npm/chart.js@4.4.1/dist/chart.umd.min.js"></script>
    <script type="module" src="./app.js"></script>

</body>
</html>
